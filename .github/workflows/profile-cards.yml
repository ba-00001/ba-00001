name: profile-cards

# Renders the two cards that would otherwise depend on a third-party service
# being up when a visitor loads the page, and publishes them as static SVGs on
# the `output` branch:
#
#   snake-{dark,light}.svg   contribution grid, eaten
#   streak-{dark,light}.svg  contribution streak
#
# Both are generated in ONE job on purpose: the publish step replaces the whole
# branch, so splitting them across workflows would make each run clobber the
# other's output.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/profile-cards.yml]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # Blueprint palette, matching assets/*.svg so the page reads as one sheet.
      - name: Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%23f0a500&color_dots=%23071626,%231d3a55,%2327506f,%2338bdf8,%237dd3fc
            dist/snake-light.svg?palette=github-light&color_snake=%23b45309&color_dots=%23e3ebf3,%23a3bed4,%230ea5e9,%230369a1,%23075985

      - name: Streak (dark)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          path: dist/streak-dark.svg
          options: >-
            user=${{ github.repository_owner }}&border_radius=0&background=071626&border=27506F&stroke=27506F&ring=38BDF8&fire=F0A500&currStreakNum=CFE9FF&sideNums=CFE9FF&currStreakLabel=38BDF8&sideLabels=5D829F&dates=5D829F

      - name: Streak (light)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          path: dist/streak-light.svg
          options: >-
            user=${{ github.repository_owner }}&border_radius=0&background=EEF3F8&border=A3BED4&stroke=A3BED4&ring=0369A1&fire=B45309&currStreakNum=123049&sideNums=123049&currStreakLabel=0369A1&sideLabels=5B7893&dates=5B7893

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
