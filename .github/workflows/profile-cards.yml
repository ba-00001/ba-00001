name: profile-cards

# Builds every card the profile shows and publishes them as static SVGs on the
# `output` branch, so a visitor's browser never depends on a third-party service
# being up when the page loads:
#
#   activity-{dark,light}.svg   12-month commit graph, drawn by assets/src/activity.py
#   snake-{dark,light}.svg      contribution grid, eaten
#   streak-{dark,light}.svg     contribution streak
#   stats/langs-{dark,light}.svg        fetched from our own stats instance
#   sum-*-{dark,light}.svg              supplementary cards
#
# All in ONE job on purpose: the publish step replaces the whole branch, so
# splitting them across workflows would make each run clobber the other's output.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-cards.yml
      - assets/src/activity.py
      - assets/src/build.py

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Streak runs FIRST, and creates dist/ as the `runner` user. Platane/snk
      # is a Docker action running as root: if it creates dist/ first, the PHP
      # streak step cannot write into it ("Permission denied").
      #
      # The action has no floating v1 tag — it must be pinned to a full version.
      - name: Streak (dark)
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          path: dist/streak-dark.svg
          options: >-
            user=${{ github.repository_owner }}&border_radius=0&background=071626&border=27506F&stroke=27506F&ring=38BDF8&fire=F0A500&currStreakNum=CFE9FF&sideNums=CFE9FF&currStreakLabel=38BDF8&sideLabels=5D829F&dates=5D829F

      - name: Streak (light)
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          path: dist/streak-light.svg
          options: >-
            user=${{ github.repository_owner }}&border_radius=0&background=EEF3F8&border=A3BED4&stroke=A3BED4&ring=0369A1&fire=B45309&currStreakNum=123049&sideNums=123049&currStreakLabel=0369A1&sideLabels=5B7893&dates=5B7893

      # FIG. 5 is drawn here rather than fetched. The activity-graph service
      # caps at 90 days — larger values are silently ignored and fall back to
      # 31 — so anything longer is only possible by rendering it ourselves,
      # which also puts the figure in the blueprint palette, not a foreign one.
      #
      # contributionsCollection only returns one year per call, so this walks
      # year by year from the account's creation date to now and concatenates
      # the daily counts. activity.py buckets them into months.
      - name: Activity graph (monthly, full history)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          user='${{ github.repository_owner }}'
          start="$(gh api "users/$user" --jq '.created_at[0:4]')"
          end="$(date -u +%Y)"
          : > days.txt
          for y in $(seq "$start" "$end"); do
            gh api graphql \
              -f login="$user" -f from="${y}-01-01T00:00:00Z" -f to="${y}-12-31T23:59:59Z" \
              -f query='query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){contributionCalendar{weeks{contributionDays{date contributionCount}}}}}}' \
              --jq '.data.user.contributionsCollection.contributionCalendar.weeks[].contributionDays[] | "\(.date) \(.contributionCount)"' \
              >> days.txt
          done
          sort -u days.txt -o days.txt
          echo "collected $(wc -l < days.txt) days, $start..$end"
          python3 assets/src/activity.py dist < days.txt

      - name: Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Blueprint palette — matches assets/*.svg so the page reads as one sheet.
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%23f0a500&color_dots=%23071626,%231d3a55,%2327506f,%2338bdf8,%237dd3fc
            dist/snake-light.svg?palette=github-light&color_snake=%23b45309&color_dots=%23e3ebf3,%23a3bed4,%230ea5e9,%230369a1,%23075985

      # Snapshot the rest so nothing is fetched at page-load time. One request
      # per card per day sits far under the unauthenticated GitHub rate limit,
      # which is why no token is needed here. A card that comes back as an error
      # or malformed SVG fails the job rather than replacing a known-good one.
      - name: Snapshot remote cards
        run: |
          set -euo pipefail
          user='${{ github.repository_owner }}'
          grs='https://github-readme-stats-ba.vercel.app'
          summary='https://github-profile-summary-cards.vercel.app/api/cards'
          hide='nushell,fortran,nix,cython,roff,tex,makefile,shell,batchfile,dockerfile'

          fetch() {
            out="dist/$1"; url="$2"
            curl -fsS --retry 5 --retry-delay 6 --retry-all-errors -m 60 "$url" -o "$out"
            if grep -qi 'Something went wrong\|Maximum retries exceeded\|rate limit' "$out"; then
              echo "::error::$1 came back as an error card"; exit 1
            fi
            python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('$out')" \
              || { echo "::error::$1 is not well-formed SVG"; exit 1; }
            echo "ok  $1  $(wc -c <"$out") bytes"
          }

          for mode in dark light; do
            if [ "$mode" = dark ]; then
              bg=071626; title=38bdf8; text=cfe9ff; icon=f0a500; border=27506f
            else
              bg=eef3f8; title=0369a1; text=123049; icon=b45309; border=a3bed4
            fi

            fetch "stats-$mode.svg" \
              "$grs/api?username=$user&show_icons=true&include_all_commits=true&count_private=true&rank_icon=percentile&border_radius=0&custom_title=FIG.%203%20%E2%80%94%20BUILD%20TELEMETRY&bg_color=$bg&title_color=$title&text_color=$text&icon_color=$icon&border_color=$border"

            fetch "langs-$mode.svg" \
              "$grs/api/top-langs/?username=$user&layout=compact&langs_count=9&count_private=true&size_weight=0.3&count_weight=0.7&hide=$hide&card_width=420&border_radius=0&custom_title=FIG.%204%20%E2%80%94%20MATERIALS&bg_color=$bg&title_color=$title&text_color=$text&border_color=$border"

            # Supplementary cards. Shown expanded, so snapshotted like the rest.
            # They only take a named theme, not our palette — hence their own
            # visual style on the page.
            sum_theme="github_$mode"
            fetch "sum-profile-$mode.svg"     "$summary/profile-details?username=$user&theme=$sum_theme"
            fetch "sum-langs-$mode.svg"       "$summary/repos-per-language?username=$user&theme=$sum_theme"
            fetch "sum-commitlang-$mode.svg"  "$summary/most-commit-language?username=$user&theme=$sum_theme"
            fetch "sum-time-$mode.svg"        "$summary/productive-time?username=$user&utcOffset=-5&theme=$sum_theme"
          done

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
