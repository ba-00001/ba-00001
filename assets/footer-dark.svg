<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="blueprint sheet">
  <defs>
    <pattern id="finefooterdark" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1d3a55" stroke-width=".5" opacity=".55"/>
    </pattern>
    <pattern id="boldfooterdark" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#27506f" stroke-width=".9" opacity=".7"/>
    </pattern>
    <linearGradient id="vigfooterdark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2036"/>
      <stop offset="1" stop-color="#071626"/>
    </linearGradient>
    <linearGradient id="sweepgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#38bdf8" stop-opacity=".13"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="wipefooterdark">
      <rect class="wipe" x="0" y="0" width="1200" height="150"/>
    </clipPath>
  </defs>
  <style>
    .fade { animation: fade .5s ease-out both; }
    .wipe { animation: wipe 1.5s cubic-bezier(.2,.7,.2,1) both; }
    .blink { animation: fade .5s ease-out 1.9s both, blink 1.1s step-end 2.4s infinite; }
    .sweep { animation: sweep var(--dur, 8s) cubic-bezier(.45,0,.55,1) infinite; }
    .flow { animation: flow 1.1s linear infinite; }
    @keyframes fade { from { opacity: 0; } }
    @keyframes wipe { from { width: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(1260px); } }
    @keyframes flow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .fade, .wipe, .blink, .sweep, .flow { animation: none; }
    }
  </style>
  <rect width="1200" height="150" fill="url(#vigfooterdark)"/>
  <rect width="1200" height="150" fill="url(#finefooterdark)"/>
  <rect width="1200" height="150" fill="url(#boldfooterdark)"/>
  <rect x="18" y="18" width="1164" height="114" fill="none"
        stroke="#27506f" stroke-width="1.4"/>
  <rect x="24" y="24" width="1152" height="102" fill="none"
        stroke="#27506f" stroke-width=".7" opacity=".7"/>
  <g stroke="#38bdf8" stroke-width="1" opacity=".65"><circle cx="30" cy="30" r="7" fill="none"/><path d="M18 30h24M30 18v24"/></g><g stroke="#38bdf8" stroke-width="1" opacity=".65"><circle cx="1170" cy="30" r="7" fill="none"/><path d="M1158 30h24M1170 18v24"/></g><g stroke="#38bdf8" stroke-width="1" opacity=".65"><circle cx="30" cy="120" r="7" fill="none"/><path d="M18 120h24M30 108v24"/></g><g stroke="#38bdf8" stroke-width="1" opacity=".65"><circle cx="1170" cy="120" r="7" fill="none"/><path d="M1158 120h24M1170 108v24"/></g>
  <text x="64" y="62" fill="#5d829f" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" letter-spacing="3" text-anchor="start" opacity="1">END OF SHEET</text>
  <path d="M64 74h1072" stroke="#27506f" stroke-width="1"/>
  <text x="64" y="104" fill="#cfe9ff" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" letter-spacing="1.8" text-anchor="start" opacity="1">DRAWN BY  BRIAN BAZURTO</text>
  <text x="600" y="104" fill="#5d829f" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" letter-spacing="1.8" text-anchor="middle" opacity="1">CHECKED BY  A FUZZER</text>
  <text x="1136" y="104" fill="#38bdf8" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" letter-spacing="1.8" text-anchor="end" opacity="1">REV C</text>
  
  <g opacity=".5">
    <rect class="sweep" style="--dur:11s" x="-90" y="0" width="90" height="150" fill="url(#sweepgrad)"/>
  </g></svg>
