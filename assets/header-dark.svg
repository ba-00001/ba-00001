    </pattern>
    <pattern id="boldheaderdark" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#27506f" stroke-width=".9" opacity=".7"/>
    </pattern>
    <linearGradient id="vigheaderdark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2036"/>
      <stop offset="1" stop-color="#071626"/>
    </linearGradient>
    <linearGradient id="sweepgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#38bdf8" stop-opacity=".13"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="wipeheaderdark">
      <rect class="wipe" x="0" y="0" width="1200" height="400"/>
    </clipPath>
  </defs>
  <style>
    .fade { animation: fade .5s ease-out both; }
    .wipe { animation: wipe 1.5s cubic-bezier(.2,.7,.2,1) both; }
    .blink { animation: fade .5s ease-out 1.9s both, blink 1.1s step-end 2.4s infinite; }
    .sweep { animation: sweep var(--dur, 8s) cubic-bezier(.45,0,.55,1) infinite; }
    .flow { animation: flow 1.1s linear infinite; }
    @keyframes fade { from { opacity: 0; } }
    @keyframes wipe { from { width: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(1260px); } }
    @keyframes flow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .fade, .wipe, .blink, .sweep, .flow { animation: none; }
    }
  </style>
