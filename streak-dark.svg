<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195" role="img" aria-label="contribution streak">
  <defs>
    <pattern id="sgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1d3a55" stroke-width=".5" opacity=".5"/>
    </pattern>
  </defs>
  <style>
    .fade { animation: fade .5s ease-out both; }
    @keyframes fade { from { opacity: 0; } }
    .ring { stroke-dasharray: 188.5; animation: draw 1.1s cubic-bezier(.2,.7,.2,1) .35s both; }
    @keyframes draw { from { stroke-dashoffset: 188.5; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .fade, .ring { animation: none; } }
  </style>
  <rect width="495" height="195" fill="#071626"/>
  <rect width="495" height="195" fill="url(#sgrid)"/>
  <rect x=".7" y=".7" width="493.6" height="193.6" fill="none"
        stroke="#27506f" stroke-width="1.4"/>
  <path d="M165.0 26V169M330.0 26V169" stroke="#27506f"
        stroke-width=".8" opacity=".7"/>
  
  <g class="fade" style="animation-delay:0.25s">
    <text x="82.5" y="78" fill="#cfe9ff" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="34" font-weight="700" letter-spacing="1" text-anchor="middle" opacity="1">10,264</text>
    <text x="82.5" y="104" fill="#5d829f" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" letter-spacing="2" text-anchor="middle" opacity="1">TOTAL CONTRIBUTIONS</text>
    <text x="82.5" y="126" fill="#5d829f" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" font-weight="400" letter-spacing="0.8" text-anchor="middle" opacity="0.85">SINCE FEB 5, 2023</text>
  </g>
  <g class="fade" style="animation-delay:0.35s">
    <circle cx="247.5" cy="72" r="30" fill="none" stroke="#27506f" stroke-width="4" opacity=".55"/>
    <circle class="ring" cx="247.5" cy="72" r="30" fill="none" stroke="#38bdf8"
            stroke-width="4" stroke-linecap="round" transform="rotate(-90 247.5 72)"/>
    <text x="247.5" y="82" fill="#cfe9ff" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="30" font-weight="700" letter-spacing="0" text-anchor="middle" opacity="1">4</text>
    <text x="247.5" y="122" fill="#38bdf8" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" letter-spacing="2" text-anchor="middle" opacity="1">CURRENT STREAK</text>
    <text x="247.5" y="140" fill="#5d829f" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" font-weight="400" letter-spacing="0.8" text-anchor="middle" opacity="0.85">SEP 7 – SEP 10, 2026</text>
  </g>
  
  <g class="fade" style="animation-delay:0.45s">
    <text x="412.5" y="78" fill="#cfe9ff" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="34" font-weight="700" letter-spacing="1" text-anchor="middle" opacity="1">19</text>
    <text x="412.5" y="104" fill="#5d829f" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" letter-spacing="2" text-anchor="middle" opacity="1">LONGEST STREAK</text>
    <text x="412.5" y="126" fill="#5d829f" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" font-weight="400" letter-spacing="0.8" text-anchor="middle" opacity="0.85">AUG 17 – SEP 4, 2026</text>
  </g>
  <text x="247.5" y="176" fill="#5d829f" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="7.5" font-weight="400" letter-spacing="1.4" text-anchor="middle" opacity="0.6">COMPUTED FROM THE CONTRIBUTIONS CALENDAR</text>
</svg>
