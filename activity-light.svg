    <linearGradient id="vigactlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3ebf3"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <linearGradient id="sweepgrad" x1="0" y1="0" x2="1" y2="0">
