    <linearGradient id="vigactdark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2036"/>
      <stop offset="1" stop-color="#071626"/>
    </linearGradient>
    <linearGradient id="sweepgrad" x1="0" y1="0" x2="1" y2="0">
